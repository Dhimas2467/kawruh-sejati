<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | Kawruh Sejati</title>
  <meta name="description" content="{{ page.description | default: page.title | escape }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header>
    <h1><a href="{{ '/' | relative_url }}">KAWRUH SEJATI</a></h1>
    <p>Wacana, pemahaman, dan laku kehidupan</p>
  </header>

  <main>
    <article>
      <h2>{{ page.title }}</h2>
      <p class="tanggal">
        {{ page.date | date: "%d-%m-%Y" }}
      </p>
      <div class="isi-artikel">
        {{ content }}
      </div>
    </article>

    <p><a href="{{ '/' | relative_url }}">← Kembali ke Beranda</a></p>
  </main>

  <footer>
    <p>KAWRUH SEJATI</p>
  </footer>
</body>
</html>
