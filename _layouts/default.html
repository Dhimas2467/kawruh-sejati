<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#315b46">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      line-height: 1.8;
      color: #292f2a;
      background: #f7f7f1;
    }
    header {
      background: #315b46;
      color: white;
      padding: 28px 18px;
      text-align: center;
    }
    header a {
      color: white;
      text-decoration: none;
    }
    nav {
      background: #e7ebdf;
      padding: 12px;
      text-align: center;
    }
    nav a {
      margin: 0 10px;
      color: #315b46;
      text-decoration: none;
      font-weight: bold;
    }
    main {
      max-width: 850px;
      margin: auto;
      padding: 24px 18px 40px;
    }
    footer {
      text-align: center;
      padding: 20px;
      border-top: 1px solid #d8ddd3;
      color: #666;
    }
  </style>
</head>
<body>
  <header>
    <h1><a href="{{ '/' | relative_url }}">KAWRUH SEJATI</a></h1>
    <p>Wacana, pemahaman, dan laku kehidupan</p>
  </header>

  <nav>
    <a href="{{ '/' | relative_url }}">Beranda</a>
    <a href="{{ '/artikel/' | relative_url }}">Artikel</a>
  </nav>

  <main>
    {{ content }}
  </main>

  <footer>
    <p>KAWRUH SEJATI</p>
  </footer>
</body>
</html>
