media:
  input: assets
  output: /assets

content:
  - name: artikel
    label: Artikel
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date]
      primary: title
    fields:
      - name: title
        label: Judul Artikel
        type: string
        required: true

      - name: date
        label: Tanggal Terbit
        type: date
        required: true

      - name: description
        label: Deskripsi
        type: string

      - name: body
        label: Isi Artikel
        type: rich-text
        required: true
